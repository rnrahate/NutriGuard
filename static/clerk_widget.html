<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NutriGuard — Secure Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; }
    body { display: flex; justify-content: center; align-items: flex-start; padding: 8px 0; }
    #clerk-sign-in { width: 100%; max-width: 440px; }
    #loader { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px; color: #94A3B8; font-size: 13px; gap: 14px; }
    .spinner { width: 30px; height: 30px; border: 3px solid rgba(45,212,191,0.15); border-top-color: #2DD4BF; border-radius: 50%; animation: spin 0.75s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err-msg { color: #F43F5E; font-size: 13px; text-align: center; padding: 12px; background: rgba(244,63,94,0.08); border: 1px solid rgba(244,63,94,0.2); border-radius: 8px; }
  </style>
  <script>
    var _pk = '';
    try { _pk = new URLSearchParams(window.location.search).get('pk') || ''; } catch(e) {}
    if (_pk) {
      var _s = document.createElement('script');
      _s.setAttribute('data-clerk-publishable-key', _pk);
      _s.setAttribute('crossorigin', 'anonymous');
      _s.src = 'https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js';
      _s.id = 'clerk-script';
      document.head.appendChild(_s);
    }
  </script>
</head>
<body>
  <div id="clerk-sign-in">
    <div id="loader"><div class="spinner"></div><span>Connecting to NutriGuard authentication...</span></div>
  </div>
  <script>
    function sendSession(token) {
      if (!token) return;
      try {
        var href = window.parent.location.href;
        var base = href.split('?')[0].split('#')[0];
        window.parent.location.replace(base + '?clerk_session=' + encodeURIComponent(token));
      } catch (e) { showError('Session redirect failed: ' + e.message); }
    }
    function showError(msg) {
      var el = document.getElementById('loader');
      if (el) el.innerHTML = '<div class="err-msg">' + msg + '</div>';
    }
    function mountSignIn() {
      var target = document.getElementById('clerk-sign-in');
      window.Clerk.mountSignIn(target, { routing: 'virtual' });
      window.Clerk.addListener(function(res) {
        if (res.session && res.session.id) sendSession(res.session.id);
      });
    }
    function initClerk() {
      if (!window.Clerk) { setTimeout(initClerk, 100); return; }
      window.Clerk.load({
        appearance: {
          variables: {
            colorPrimary: '#2DD4BF', colorBackground: '#171E27',
            colorText: '#F8FAFC', colorInputBackground: '#10161D',
            colorInputText: '#F8FAFC', colorTextSecondary: '#94A3B8',
            borderRadius: '8px'
          },
          elements: {
            rootBox: { width: '100%' },
            card: { backgroundColor: '#171E27', border: '1px solid #222D3D', boxShadow: '0 16px 48px rgba(0,0,0,0.6)' },
            headerTitle: { color: '#F8FAFC', fontWeight: '700' },
            headerSubtitle: { color: '#94A3B8' },
            socialButtonsBlockButton: { backgroundColor: '#1A2233', borderColor: '#2E3D52', color: '#F8FAFC' },
            socialButtonsBlockButtonText: { color: '#F8FAFC', fontWeight: '600' },
            dividerLine: { backgroundColor: '#2E3D52' },
            dividerText: { color: '#64748B' },
            formFieldLabel: { color: '#CBD5E1' },
            formFieldInput: { backgroundColor: '#10161D', borderColor: '#2E3D52', color: '#F8FAFC' },
            formButtonPrimary: { backgroundColor: '#2DD4BF', color: '#0B0F14', fontWeight: '700' },
            footerActionLink: { color: '#2DD4BF' }
          }
        }
      }).then(function() {
        var loader = document.getElementById('loader');
        if (loader) loader.style.display = 'none';
        if (window.Clerk.session && window.Clerk.session.id) { sendSession(window.Clerk.session.id); return; }
        mountSignIn();
      }).catch(function(err) { showError('Auth error: ' + (err.message || String(err))); });
    }
    var clerkScript = document.getElementById('clerk-script');
    if (clerkScript) {
      clerkScript.addEventListener('load', initClerk);
      clerkScript.addEventListener('error', function() { showError('Failed to load Clerk SDK. Check your network.'); });
    } else {
      showError('No Clerk publishable key. Configure CLERK_PUBLISHABLE_KEY in Streamlit secrets.');
    }
  </script>
</body>
</html>
